name: Native image processing

on:
  pull_request:
    paths:
      - 'server/**'
      - 'docs/image-processing.md'
      - '.github/workflows/image-processing.yml'
  push:
    paths:
      - 'server/**'
      - 'docs/image-processing.md'
      - '.github/workflows/image-processing.yml'

permissions:
  contents: read

jobs:
  native-image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare pinned ImageMagick without FUSE
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 'https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-34/ImageMagick-7.1.2-34-gcc-x86_64.AppImage' -o magick.AppImage
          echo '6e9edfd35d5f30b57c27533afe003d6085faaf8607b207426f398d11751acf93  magick.AppImage' | sha256sum -c -
          chmod +x magick.AppImage
          ./magick.AppImage --appimage-extract >/dev/null
          "$RUNNER_TEMP/squashfs-root/AppRun" -version
          echo "IMAGE_MAGICK=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Verify server with native image tests
        working-directory: server
        shell: bash
        run: |
          chmod +x mvnw
          printf '%s\n' '<settings><mirrors><mirror><id>central-native-tests</id><mirrorOf>*</mirrorOf><url>https://repo.maven.apache.org/maven2</url></mirror></mirrors></settings>' > "$RUNNER_TEMP/image-maven-settings.xml"
          ./mvnw -B -ntp -s "$RUNNER_TEMP/image-maven-settings.xml" -Dultimate.image.integration.binary="$IMAGE_MAGICK" -Dultimate.image.benchmark=true clean verify
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-image-test-results
          path: |
            server/target/surefire-reports/
            server/target/image-processing-benchmark.json
          if-no-files-found: warn
